# ============================================================
#  setup_wsl 默认配置
# ------------------------------------------------------------
#  格式规范（严格）：KEY=value
#    · 值内不得出现空格；列表用英文逗号分隔
#    · 不要给值加引号
#    · 以 # 开头的行为注释，空行忽略
#  Windows 侧与 Linux 侧共用本文件，两侧解析器都遵守此规范。
#
#  ⚠ 不要直接改本文件。复制成 config/local.conf 后改那一份。
# ============================================================

# ---------------- 发行版 ----------------
# WSL 注册名，即 wsl -d <名字>
DISTRO_NAME=archlinux
# Windows 侧安装根目录。建议非系统盘；用正斜杠
INSTALL_ROOT=D:/WSL
# 发行版数据目录。留空 = <INSTALL_ROOT>/<DISTRO_NAME>
DISTRO_DIR=
# 镜像版本：latest，或锁定具体版本号如 2026.09.01.176721
IMAGE_VERSION=latest
# 官方镜像站（geo 与 fastly 互为校验，国内实测可达）
IMAGE_MIRROR=https://geo.mirror.pkgbuild.com
IMAGE_ALT_MIRROR=https://fastly.mirror.pkgbuild.com

# ---------------- Linux 用户 ----------------
LINUX_USER=h
# 留空 = 安装时交互输入。若填写，请只写在 config/local.conf 里
LINUX_PASSWORD=
LINUX_SHELL=/bin/bash

# ---------------- 环境 ----------------
TIMEZONE=Asia/Shanghai
LOCALE_LANG=en_US.UTF-8
LOCALE_EXTRA=zh_CN.UTF-8
# 镜像源方案：cn = 国内加速 / official = Arch 官方源
MIRROR_PROFILE=cn
PARALLEL_DOWNLOADS=8

# ---------------- 功能开关（yes/no）----------------
INSTALL_DEVTOOLS=yes
SETUP_PACKAGE_MIRRORS=yes
SETUP_SSH=yes
CREATE_SHORTCUT=yes
# 开始菜单里的显示名。留空 = 用 DISTRO_NAME
SHORTCUT_NAME=Arch Linux
CONFIGURE_SWAP=yes

# ---------------- 资源 ----------------
# WSL2 交换文件大小，如 4GB。留空 = WSL 默认（物理内存 25%）
SWAP_SIZE=4GB

# ---------------- 软件包 ----------------
PACKAGES_FILE=data/packages-dev.txt
# 追加包，英文逗号分隔，例如 EXTRA_PACKAGES=docker,neovim
EXTRA_PACKAGES=

# ---------------- 高级 ----------------
# 只跑指定的 Linux 阶段编号，逗号分隔（如 02,03）；留空 = 全部按序
LINUX_STAGES=
# 日志保留天数
LOG_KEEP_DAYS=30
